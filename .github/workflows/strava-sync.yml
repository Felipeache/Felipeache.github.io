name: Sync Strava training

on:
  schedule:
    - cron: "0 20 * * *"    # once a day at 20:00 UTC (21:00 in Paris in winter, 22:00 in summer)
  push:
    branches: [main]          # runs on every deploy to main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Strava activities and write aggregated data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python3 scripts/sync_strava.py

      - name: Commit the data file if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/training.js data/strava_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Strava training data"
            git push
          fi
