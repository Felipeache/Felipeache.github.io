@media (prefers-color-scheme: dark) {

* { box-sizing: border-box; }
body {

/* ---- Data presentation and motion (shared) ---- */
html { scroll-behavior: auto; }
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
main { transition: opacity 0.18s ease; }
main.is-swapping { opacity: 0; }

.site-header.is-scrolled { box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 16px 0 8px; }
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
}
.stat-value {
  margin: 0; font-size: clamp(1.9rem, 5vw, 2.4rem); font-weight: 700; line-height: 1.1;
  color: var(--accent); font-variant-numeric: tabular-nums;
}
.stat-value .unit { font-size: 0.6em; margin-left: 2px; }
.stat-label { margin: 6px 0 0; color: var(--muted); font-size: 0.9rem; }

.card.lift { transition: transform 0.2s ease, border-color 0.2s ease; }
.card.lift:hover { transform: translateY(-2px); border-color: var(--accent); }

.timeline { position: relative; padding-left: 22px; border-left: 2px solid var(--border); margin: 8px 0 0 6px; }
.tl-item { position: relative; padding-bottom: 18px; }
.tl-item::before {
  content: ""; position: absolute; left: -29px; top: 6px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--bg);
}
.tl-date { margin: 0 0 6px; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

.skill-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.skill { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; }
.pill {
  display: inline-block; font-size: 0.78rem; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--accent-soft); color: var(--accent-2); white-space: nowrap;
}

.stepper { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 16px; }
.step { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; margin: 0; }
.step-num {
  width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--surface);
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.step-text { margin: 6px 0 0; }

@media (min-width: 720px) {
  .stepper { grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .stepper:has(.step:nth-child(6)) { grid-template-columns: repeat(3, 1fr); }
  .step { grid-template-columns: 1fr; }
}

.js-reveal [data-reveal]:not(.in),
.js-reveal .stat:not(.in) { opacity: 0; transform: translateY(12px); }
[data-reveal], .stat { transition: opacity 0.5s ease, transform 0.5s ease; }
[data-reveal].in, .stat.in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .js-reveal [data-reveal]:not(.in),
  .js-reveal .stat:not(.in) { opacity: 1; transform: none; }
  .card.lift:hover { transform: none; }
}

/* ---- Theme toggle and accent colours ---- */

/* ---- Training dashboard ---- */
.chart { width: 100%; height: auto; display: block; margin: 8px 0 4px; }
.chart .bar { fill: var(--accent); transform-box: fill-box; transform-origin: bottom; animation: grow 0.8s ease both; }

.tip {
  position: absolute; transform: translate(-50%, calc(-100% - 8px)); z-index: 2;

.recent-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }

.recent-table th { color: var(--muted); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .chart .bar { animation: none; transition: none; } }

  <script>
// Shared language switcher used by every page.
// Pages call SiteLang.pick() for the starting language, SiteLang.renderButtons()
// to draw the flags, and SiteLang.store() to remember the choice.
const SiteLang = (() => {
  const LANGS = ['es', 'en', 'fr'];
  const NAMES = { es: 'Español', en: 'English', fr: 'Français' };
  const STORAGE_KEY = 'site-lang';

  const FLAGS = {
    es: '<svg viewBox="0 0 60 40" aria-hidden="true" focusable="false"><rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/></svg>',
    en: '<svg viewBox="0 0 60 40" aria-hidden="true" focusable="false"><rect width="60" height="40" fill="#012169"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="8"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="3"/><path d="M30,0 V40 M0,20 H60" stroke="#fff" stroke-width="12"/><path d="M30,0 V40 M0,20 H60" stroke="#C8102E" stroke-width="7"/></svg>',
    fr: '<svg viewBox="0 0 60 40" aria-hidden="true" focusable="false"><rect width="20" height="40" fill="#002395"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ED2939"/></svg>'
  };

  function readStored() {
    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  }

  function pick() {
    const stored = readStored();
    if (LANGS.includes(stored)) return stored;
    const browser = (navigator.language || 'en').slice(0, 2).toLowerCase();
    return LANGS.includes(browser) ? browser : 'en';
  }

  function store(lang) {
    try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) { /* storage unavailable */ }
  }

  function renderButtons(container, current, onPick) {
    container.textContent = '';
    LANGS.forEach(code => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('aria-label', NAMES[code]);
      btn.setAttribute('aria-pressed', String(code === current));
      btn.title = NAMES[code];
      btn.innerHTML = FLAGS[code];
      btn.addEventListener('click', () => onPick(code));
      container.appendChild(btn);
    });
  }

  return { LANGS, NAMES, pick, store, renderButtons };
})();
</script>

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const CAN_IO = 'IntersectionObserver' in window;
    const CAN_ANIMATE = !REDUCED && CAN_IO;
    if (CAN_ANIMATE) document.documentElement.classList.add('js-reveal');
    const io = CAN_ANIMATE ? new IntersectionObserver(onIntersect, { threshold: 0.15 }) : null;

    function onIntersect(entries, obs) {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const node = entry.target;
        obs.unobserve(node);
        node.classList.add('in');
        if (node.classList.contains('stat')) countUp(node);
      });
    }

    function observe(root) {
      if (!io) return;
      root.querySelectorAll('[data-reveal]:not([data-watch]), .stat:not([data-watch])').forEach(node => {
        node.dataset.watch = '';
        io.observe(node);
      });
    }

    function countUp(stat) {
      stat.querySelectorAll('.count').forEach(node => {
        const to = Number(node.dataset.to);
        const start = performance.now();
        const dur = 1100;
        node.textContent = '0';
        const tick = () => {
          const p = Math.max(0, Math.min(1, (performance.now() - start) / dur));
          const eased = 1 - Math.pow(1 - p, 3);
          node.textContent = p < 1 ? String(Math.round(to * eased)) : node.dataset.to;
          if (p < 1) setTimeout(tick, 16);
        };
        tick();
      });
    }

    function switchLang(lang) {
      const main = document.querySelector('main');
      const active = document.activeElement;
      const refocus = active && active.closest && active.closest('#lang') ? active.getAttribute('aria-label') : null;
      const apply = () => {
        render(lang);
        if (refocus) {
          const btn = document.querySelector('#lang button[aria-label="' + refocus + '"]');
          if (btn) btn.focus({ preventScroll: true });
        }
      };
      if (REDUCED) { apply(); return; }
      main.classList.add('is-swapping');
      setTimeout(() => {
        apply();
        requestAnimationFrame(() => main.classList.remove('is-swapping'));
      }, 160);
    }

    const header = document.querySelector('.site-header');
    function updateHeader() { header.classList.toggle('is-scrolled', window.scrollY > 4); }
    window.addEventListener('scroll', updateHeader, { passive: true });
    updateHeader();

    function renderStats(stats) {
      const wrap = el('div', 'stats');
      stats.forEach(s => {
        const box = el('div', 'stat');
        const value = el('p', 'stat-value');
        const count = el('span', 'count', s.num);
        count.dataset.to = s.num;
        value.appendChild(count);
        if (s.unit) value.appendChild(el('span', 'unit', s.unit));
        box.append(value, el('p', 'stat-label', s.label));
        wrap.appendChild(box);
      });
      return wrap;
    }

    function setText(id, text) {
      document.getElementById(id).textContent = text;
    }

    function renderSection(s) {
      const wrap = document.createElement('div');
      wrap.dataset.reveal = '';
      const h = document.createElement('h2');
      h.textContent = s.heading;
      wrap.appendChild(h);
      if (s.text) {
        const p = document.createElement('p');
        p.textContent = s.text;
        wrap.appendChild(p);
      }
      if (s.steps) {
        const cols = s.steps.length <= 4 ? s.steps.length : 3;
        const ol = document.createElement('ol');
        ol.className = 'stepper';
        ol.setAttribute('role', 'list');
        ol.style.setProperty('--cols', String(cols));
        s.steps.forEach((step, i) => {
          const li = document.createElement('li');
          li.className = 'step';
          if ((i + 1) % cols === 0) li.classList.add('row-end');
          const num = document.createElement('span');
          num.className = 'step-num';
          num.textContent = String(i + 1);
          const p = document.createElement('p');
          p.className = 'step-text';
          p.textContent = step;
          li.append(num, p);
          ol.appendChild(li);
        });
        wrap.appendChild(ol);
      }
      if (s.items) {
        const ul = document.createElement('ul');
        s.items.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item;
          ul.appendChild(li);
        });
        wrap.appendChild(ul);
      }
      if (s.tags) {
        const chips = document.createElement('div');
        chips.className = 'chips';
        s.tags.forEach(tag => {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = tag;
          chips.appendChild(span);
        });
        wrap.appendChild(chips);
      }
      return wrap;
    }

    function num(n, lang, d) {
      return Number(n).toLocaleString(lang, { maximumFractionDigits: d, minimumFractionDigits: d });
    }
    function dateFmt(iso, lang) {
      return new Date(iso + 'T00:00:00').toLocaleDateString(lang, { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function hm(sec, lang) {
      const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
      return h + ' h ' + String(m).padStart(2, '0') + ' min';
    }
    function svgEl(tag, attrs) {
      const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.keys(attrs).forEach(k => n.setAttribute(k, attrs[k]));
      return n;
    }
    const COLORS = { run: 'var(--accent)', ride: 'var(--accent-2)', strength: '#c2410c', swim: '#0891b2', other: 'var(--muted)' };
    const ORDER = ['run', 'ride', 'strength', 'swim', 'other'];

    function renderKpis(lang, t, D) {
      const box = document.getElementById('kpis');
      box.textContent = '';
      [[num(D.totals.km, lang, 0) + ' km', t.labels.distance],
       [num(D.totals.hours, lang, 0) + ' h', t.labels.time],
       [num(D.totals.elevation, lang, 0) + ' m', t.labels.elevation],
       [num(D.totals.sessions, lang, 0), t.labels.sessions]].forEach(([v, l]) => {
        const c = el('div', 'stat');
        c.append(el('p', 'stat-value', v), el('p', 'stat-label', l));
        box.appendChild(c);
      });
    }

    function tipFor(container) {
      const tip = el('div', 'tip');
      tip.setAttribute('role', 'tooltip');
      tip.hidden = true;
      container.appendChild(tip);
      return tip;
    }

    function bindTip(container, tip, bar, text) {
      bar.setAttribute('tabindex', '0');
      bar.setAttribute('aria-label', text);
      const show = () => {
        tip.textContent = text;
        tip.hidden = false;
        const c = container.getBoundingClientRect();
        const r = bar.getBoundingClientRect();
        const half = tip.offsetWidth / 2;
        const x = Math.max(half, Math.min(c.width - half, r.left + r.width / 2 - c.left));
        tip.style.left = x + 'px';
        tip.style.top = (r.top - c.top) + 'px';
      };
      const hide = () => { tip.hidden = true; };
      bar.addEventListener('mouseenter', show);
      bar.addEventListener('mouseleave', hide);
      bar.addEventListener('focus', show);
      bar.addEventListener('blur', hide);
      bar.addEventListener('click', show);
    }

    function renderMonthly(lang, t, D) {
      const box = document.getElementById('monthly');
      box.textContent = '';
      box.className = 'chart-wrap';
      const tip = tipFor(box);
      const W = 640, H = 230, top = 30, base = 196;
      const max = Math.max(1, ...D.months.map(m => m.km));
      const fmtMonth = new Intl.DateTimeFormat(lang, { month: 'short' });
      const fmtLong = new Intl.DateTimeFormat(lang, { month: 'long', year: 'numeric' });
      const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart', role: 'img', 'aria-label': t.labels.monthly });
      const bw = W / D.months.length;
      svg.appendChild(svgEl('line', { x1: 0, y1: base, x2: W, y2: base, class: 'axis-line' }));
      D.months.forEach((m, i) => {
        const date = new Date(m.month + '-01T00:00:00');
        const h = (m.km / max) * (base - top);
        const x = i * bw;
        const rect = svgEl('rect', { x: x + bw * 0.15, y: base - h, width: bw * 0.7, height: h, rx: 3, class: 'bar', style: 'animation-delay:' + (i * 40) + 'ms' });
        svg.appendChild(rect);
        const hours = Math.floor(m.hours), mins = Math.round((m.hours - hours) * 60);
        const text = fmtLong.format(date) + ' · ' + num(m.km, lang, 1) + ' km · ' + m.sessions + ' ' +
          t.labels.sessions.toLowerCase() + ' · ' + hours + ' h ' + String(mins).padStart(2, '0') + ' min · ' +
          num(m.elevation, lang, 0) + ' m';
        bindTip(box, tip, rect, text);
        if (m.km > 0) {
          const v = svgEl('text', { x: x + bw / 2, y: base - h - 6, class: 'value', 'text-anchor': 'middle' });
          v.textContent = num(m.km, lang, 0);
          svg.appendChild(v);
        }
        const label = svgEl('text', { x: x + bw / 2, y: base + 20, class: 'axis', 'text-anchor': 'middle' });
        label.textContent = fmtMonth.format(date).slice(0, 3);
        svg.appendChild(label);
      });
      box.appendChild(svg);
    }

    function renderWeekly(lang, t, D) {
      const box = document.getElementById('weekly');
      box.textContent = '';
      box.className = 'chart-wrap';
      const tip = tipFor(box);
      const W = 640, H = 170, top = 22, base = 140, left = 34;
      const max = Math.max(1, ...D.weeks.map(w => w.sessions));
      const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart', role: 'img', 'aria-label': t.labels.weekly });
      const innerW = W - left - 6;
      const bw = innerW / D.weeks.length;
      svg.appendChild(svgEl('line', { x1: left, y1: base, x2: W - 6, y2: base, class: 'axis-line' }));
      const yMax = svgEl('text', { x: left - 6, y: top + 4, class: 'axis', 'text-anchor': 'end' });
      yMax.textContent = String(max);
      svg.appendChild(yMax);
      const yZero = svgEl('text', { x: left - 6, y: base, class: 'axis', 'text-anchor': 'end' });
      yZero.textContent = '0';
      svg.appendChild(yZero);
      D.weeks.forEach((w, i) => {
        const x = left + i * bw;
        const h = (w.sessions / max) * (base - top);
        const rect = svgEl('rect', { x: x + bw * 0.15, y: base - h, width: bw * 0.7, height: h, rx: 2, class: 'bar bar-week', style: 'animation-delay:' + (i * 15) + 'ms' });
        svg.appendChild(rect);
        bindTip(box, tip, rect, dateFmt(w.week, lang) + ' · ' + w.sessions + ' ' + t.labels.sessions.toLowerCase());
        if (w.sessions > 0) {
          const v = svgEl('text', { x: x + bw / 2, y: base - h - 4, class: 'value', 'text-anchor': 'middle' });
          v.textContent = String(w.sessions);
          svg.appendChild(v);
        }
        if (i % 8 === 0) {
          const d = new Date(w.week + 'T00:00:00');
          const label = svgEl('text', { x: x + bw / 2, y: H - 6, class: 'axis', 'text-anchor': 'start' });
          label.textContent = d.toLocaleDateString(lang, { day: 'numeric', month: 'short' });
          svg.appendChild(label);
        }
      });
      box.appendChild(svg);
    }

    function renderMix(lang, t, D) {
      const total = Object.values(D.mix).reduce((a, b) => a + b, 0) || 1;
      const donut = document.getElementById('donut');
      donut.textContent = '';
      const svg = svgEl('svg', { viewBox: '0 0 120 120', class: 'donut', role: 'img', 'aria-label': t.labels.mix });
      const r = 44, C = 2 * Math.PI * r;
      let offset = 0;
      ORDER.forEach(k => {
        const v = D.mix[k] || 0;
        if (!v) return;
        const len = (v / total) * C;
        svg.appendChild(svgEl('circle', { cx: 60, cy: 60, r: r, fill: 'none', stroke: COLORS[k], 'stroke-width': 18,
          'stroke-dasharray': len + ' ' + (C - len), 'stroke-dashoffset': -offset, transform: 'rotate(-90 60 60)' }));
        offset += len;
      });
      donut.appendChild(svg);
      const legend = document.getElementById('legend');
      legend.textContent = '';
      ORDER.forEach(k => {
        const v = D.mix[k] || 0;
        if (!v) return;
        const li = el('li', 'legend-item');
        const sw = el('span', 'swatch');
        sw.style.background = COLORS[k];
        li.append(sw, document.createTextNode(' ' + t.types[k] + ': ' + v + ' (' + Math.round(100 * v / total) + '%)'));
        legend.appendChild(li);
      });
    }

    function renderRecords(lang, t, D) {
      const box = document.getElementById('records');
      box.textContent = '';
      [[t.labels.longest_run, D.records.run], [t.labels.longest_ride, D.records.ride], [t.labels.longest, D.records.longest]].forEach(([label, rec]) => {
        const c = el('article', 'card');
        c.appendChild(el('h3', null, label));
        if (rec) {
          c.appendChild(el('p', 'stat-value', num(rec.km, lang, 1) + ' km'));
          c.appendChild(el('p', 'meta', clock(rec.seconds) + ' · ' + dateFmt(rec.date, lang)));
        } else {
          c.appendChild(el('p', 'meta', '—'));
        }
        box.appendChild(c);
      });
    }

    function renderRecent(lang, t, D) {
      const box = document.getElementById('recent');
      box.textContent = '';
      const table = el('table', 'recent-table');
      const head = el('tr');
      [t.labels.date, t.labels.type, t.labels.distance, t.labels.time].forEach(h => head.appendChild(el('th', null, h)));
      const thead = el('thead');
      thead.appendChild(head);
      table.appendChild(thead);
      const body = el('tbody');
      D.recent.forEach(r => {
        const tr = el('tr');
        tr.appendChild(el('td', null, dateFmt(r.date, lang)));
        tr.appendChild(el('td', null, t.types[r.category] || r.category));
        tr.appendChild(el('td', null, num(r.km, lang, 1) + ' km'));
        tr.appendChild(el('td', null, hm(r.seconds, lang)));
        body.appendChild(tr);
      });
      table.appendChild(body);
      box.appendChild(table);
    }

    function renderPbs(lang, t, D) {
      const box = document.getElementById('pbs');
      box.textContent = '';
      const pb = D.pbs || { best: [], runs_checked: 0, runs_total: 0, complete: false };
      setText('h-pbs', t.labels.pbs);
      const note = document.getElementById('pbs-note');
      note.textContent = pb.complete ? '' : t.labels.pbs_progress.replace('{done}', pb.runs_checked).replace('{total}', pb.runs_total);
      if (!pb.best.some(Boolean)) {
        box.appendChild(el('p', 'note', t.labels.pbs_empty));
        return;
      }
      const table = el('table', 'recent-table');
      const head = el('tr');
      [t.labels.distance, t.labels.time, t.labels.date].forEach(h => head.appendChild(el('th', null, h)));
      const thead = el('thead');
      thead.appendChild(head);
      table.appendChild(thead);
      const body = el('tbody');
      pb.best.forEach((b, i) => {
        const tr = el('tr');
        tr.appendChild(el('td', null, t.labels.pb_names[PB_ORDER[i]]));
        tr.appendChild(el('td', null, b ? clock(b.seconds) : '—'));
        tr.appendChild(el('td', null, b ? dateFmt(b.date, lang) : '—'));
        body.appendChild(tr);
      });
      table.appendChild(body);
      box.appendChild(table);
    }

    const PB_ORDER = ['5k', '10k', 'Half-Marathon', 'Marathon'];

    function clock(sec) {
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
      const mm = String(m).padStart(h ? 2 : 1, '0'), ss = String(s).padStart(2, '0');
      return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
    }

    function render(lang) {
      const t = T[lang];
      const D = window.TRAINING_DATA;
      document.documentElement.lang = lang;
      document.title = t.meta.title;
      document.querySelector('meta[name="description"]').setAttribute('content', t.meta.description);

      SiteLang.renderButtons(document.getElementById('lang'), lang, switchLang);
      renderThemeToggle(lang);
      setText('back', t.back);
      setText('note', t.note);
      setText('title', t.title);
      setText('lead', t.lead);
      setText('footer', t.footer + ' © ' + new Date().getFullYear());
      setText('h-monthly', t.labels.monthly);
      setText('h-weekly', t.labels.weekly);
      setText('h-mix', t.labels.mix);
      setText('h-records', t.labels.records);
      setText('h-recent', t.labels.recent);
      document.getElementById('empty').hidden = !!D;
      setText('empty', t.labels.empty);
      document.getElementById('dashboard').hidden = !D;
      if (D) {
        setText('credit', t.labels.credit + ' · ' + t.labels.updated + ': ' + new Date(D.generated_at).toLocaleString(lang, { dateStyle: 'medium', timeStyle: 'short' }));
        renderKpis(lang, t, D);
        renderMonthly(lang, t, D);
        renderWeekly(lang, t, D);
        renderMix(lang, t, D);
        renderRecords(lang, t, D);
        renderRecent(lang, t, D);
        renderPbs(lang, t, D);
      }
      SiteLang.store(lang);
    }

    const THEME_LABELS = {
      en: ['Switch to light theme', 'Switch to dark theme'],
      es: ['Cambiar a tema claro', 'Cambiar a tema oscuro'],
      fr: ['Passer au thème clair', 'Passer au thème sombre']
    };
    const ICON_SUN = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
    const ICON_MOON = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

    function renderThemeToggle(lang) {
      const btn = document.getElementById('theme-toggle');
      const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
      btn.innerHTML = isDark ? ICON_SUN : ICON_MOON;
      const label = THEME_LABELS[lang][isDark ? 0 : 1];
      btn.setAttribute('aria-label', label);
      btn.title = label;
      btn.onclick = () => {
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('site-theme', next); } catch (e) { /* storage unavailable */ }
        renderThemeToggle(lang);
      };
    }

    render(SiteLang.pick());
  </script>
  <script>
    (function () {
      var start = Date.now();
      var sent = false;
      function bucket(sec) {
        return sec < 10 ? 'under-10s' : sec < 60 ? '10-60s' : sec < 180 ? '1-3min' : 'over-3min';
      }
      function send() {
        if (sent || typeof goatcounter === 'undefined' || !goatcounter.count) return;
        sent = true;
        var sec = Math.round((Date.now() - start) / 1000);
        try {
          goatcounter.count({ path: 'time/' + bucket(sec) + location.pathname, event: true, title: 'Time on page' });
        } catch (e) { /* analytics unavailable */ }
      }
      window.addEventListener('pagehide', send);
    })();
  </script>
  <script>
    (function () {
      var SITE_HOSTS = ['henao.me', 'www.henao.me', 'felipeache.github.io'];
      function send(path) {
        if (typeof goatcounter === 'undefined' || !goatcounter.count) return;
        try { goatcounter.count({ path: path, event: true, title: path }); } catch (e) { /* analytics unavailable */ }
      }
      function labelFor(a) {
        var href = a.getAttribute('href') || '';
        if (href.indexOf('mailto:') === 0) return 'email';
        if (a.hostname === 'www.linkedin.com') return 'linkedin';
        if (a.hostname === 'github.com') return 'github';
        if (href === '#contact') return 'contact-button';
        if (href.charAt(0) === '#') return 'section/' + href.slice(1);
        if (a.classList.contains('back')) return 'back';
        if (href.indexOf('deduplication') !== -1) return 'project-deduplication';
        if (href.indexOf('validation') !== -1) return 'project-validation';
        return 'other';
      }
      var from = null;
      try { from = document.referrer ? new URL(document.referrer) : null; } catch (e) { from = null; }
      if (from && SITE_HOSTS.indexOf(from.hostname) !== -1) {
        send('nav/' + from.pathname + ' > ' + location.pathname);
      } else {
        send('entry' + location.pathname);
      }
      document.addEventListener('click', function (e) {
        var a = e.target.closest ? e.target.closest('a[href]') : null;
        if (a) send('click/' + labelFor(a));
      });
    })();
  </script>
</body>
