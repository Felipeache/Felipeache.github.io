  <script>
const SiteLang = (() => {
  const LANGS = ['es', 'en', 'fr'];
  const NAMES = { es: 'Español', en: 'English', fr: 'Français' };
  const STORAGE_KEY = 'site-lang';
  const FLAGS = {
    es: '<svg viewBox="0 0 60 40" aria-hidden="true" focusable="false"><rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/></svg>',
    en: '<svg viewBox="0 0 60 40" aria-hidden="true" focusable="false"><rect width="60" height="40" fill="#012169"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="8"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="3"/><path d="M30,0 V40 M0,20 H60" stroke="#fff" stroke-width="12"/><path d="M30,0 V40 M0,20 H60" stroke="#C8102E" stroke-width="7"/></svg>',
    fr: '<svg viewBox="0 0 60 40" aria-hidden="true" focusable="false"><rect width="20" height="40" fill="#002395"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ED2939"/></svg>'
  };
  function readStored() {
    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  }
  function pick() {
    const stored = readStored();
    if (LANGS.includes(stored)) return stored;
    const browser = (navigator.language || 'en').slice(0, 2).toLowerCase();
    return LANGS.includes(browser) ? browser : 'en';
  }
  function store(lang) {
    try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) { /* storage unavailable */ }
  }
  function renderButtons(container, current, onPick) {
    container.textContent = '';
    LANGS.forEach(code => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('aria-label', NAMES[code]);
      btn.setAttribute('aria-pressed', String(code === current));
      btn.title = NAMES[code];
      btn.innerHTML = FLAGS[code];
      btn.addEventListener('click', () => onPick(code));
      container.appendChild(btn);
    });
  }
  return { LANGS, NAMES, pick, store, renderButtons };
})();

    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let selectedCode = null;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function setText(id, text) {
      document.getElementById(id).textContent = text;
    }

    function statusLabel(t, status) {
      return t.labels[status] || status;
    }

    function darkTextColor(hex) {
      const h = (hex || '#000').replace('#', '');
      const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
      const n = parseInt(full, 16);
      const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      return (0.299 * r + 0.587 * g + 0.114 * b) > 160;
    }

    const PARIS_TZ = 'Europe/Paris';

    function formatWhen(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString(undefined, {
          dateStyle: 'medium',
          timeStyle: 'short',
          timeZone: PARIS_TZ
        });
      } catch (e) {
        return iso;
      }
    }

    /** Calendar parts in Europe/Paris (not the visitor's local timezone). */
    function parisParts(d) {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: PARIS_TZ,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(d || new Date());
      const map = {};
      parts.forEach(p => { if (p.type !== 'literal') map[p.type] = p.value; });
      return map;
    }

    function currentMonthKey() {
      const p = parisParts();
      return p.year + '-' + p.month;
    }

    function currentYearKey() {
      return parisParts().year;
    }

      const items = [
        [t.labels.total, D.summary.lines_total],
        [t.labels.disrupted, D.summary.lines_disrupted],
        [t.labels.normalNow, D.summary.lines_normal],
        [t.labels.updated, formatWhen(D.generated_at)]
      ];
      items.forEach(([label, value], i) => {
        const box = document.createElement('div');
        box.appendChild(el('dt', null, label));
        box.appendChild(el('dd', null, String(value)));
        if (i === 0) box.style.borderLeft = '0';
        strip.appendChild(box);
      });
    }

    function renderLines(t, D) {
      const grid = document.getElementById('line-grid');
      grid.textContent = '';
      if (!selectedCode && D.lines.length) selectedCode = D.lines[0].code;
      D.lines.forEach(line => {
        const btn = el('button', 'line-card' + (line.code === selectedCode ? ' is-selected' : ''));
        btn.type = 'button';
        btn.setAttribute('role', 'listitem');
        btn.setAttribute('aria-pressed', String(line.code === selectedCode));
        const badge = el('span', 'line-badge', line.code);
        badge.style.background = line.color;
        if (darkTextColor(line.color)) badge.classList.add('dark-text');
        const meta = el('div', 'line-meta');
        meta.appendChild(el('strong', null, 'Line ' + line.code));
        meta.appendChild(el('p', 'route', line.name));
        meta.appendChild(el('span', 'status-pill ' + line.status, statusLabel(t, line.status)));
        btn.append(badge, meta);
        btn.addEventListener('click', () => {
          selectedCode = line.code;
          if (typeof siteTrack === 'function') siteTrack('click/metro-line-' + line.code);
          renderLines(t, D);
          renderDetail(t, D);
        });
        grid.appendChild(btn);
      });
    }

    function renderCountTable(title, map, emptyLabel) {
      const wrap = document.createElement('div');
      wrap.appendChild(el('h3', null, title));
      const keys = Object.keys(map || {});
      if (!keys.length) {
        wrap.appendChild(el('p', 'muted', emptyLabel));
        return wrap;
      }
      const table = el('table', 'count-table');
      const thead = document.createElement('thead');
      const hr = document.createElement('tr');
      hr.append(el('th', null, ''), el('th', null, ''));
      thead.appendChild(hr);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      keys.slice().reverse().forEach(k => {
        const tr = document.createElement('tr');
        tr.append(el('td', null, k), el('td', null, String(map[k])));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      return wrap;
    }

    function renderDetail(t, D) {
      const panel = document.getElementById('detail-panel');
      panel.textContent = '';
      const line = (D.lines || []).find(l => l.code === selectedCode);
      if (!line) {
        panel.appendChild(el('p', 'muted', t.labels.select));
        return;
      }
      const head = el('div', 'detail-head');
      const badge = el('span', 'line-badge', line.code);
      badge.style.background = line.color;
      if (darkTextColor(line.color)) badge.classList.add('dark-text');
      const titleWrap = document.createElement('div');
      titleWrap.appendChild(el('h3', null, 'Line ' + line.code));
      titleWrap.appendChild(el('p', 'muted', line.name));
      titleWrap.appendChild(el('span', 'status-pill ' + line.status, statusLabel(t, line.status)));
      head.append(badge, titleWrap);
      panel.appendChild(head);

      const msgs = line.messages || [];
      if (!msgs.length) {
        panel.appendChild(el('p', 'muted', t.labels.noMessages));
      } else {
        const ul = el('ul', 'msg-list');
        msgs.forEach(m => {
          const li = document.createElement('li');
          li.appendChild(el('div', 'sev status-pill ' + m.severity, statusLabel(t, m.severity)));
          li.appendChild(el('p', null, m.title || ''));
          ul.appendChild(li);
        });
        panel.appendChild(ul);
      }

      const stats = line.stats || { by_month: {}, by_year: {}, max_clear_days: 0, current_clear_streak: 0 };
      const monthKey = currentMonthKey();
      const yearKey = currentYearKey();
      const grid = el('div', 'stats-grid');
      [
        [stats.by_year[yearKey] || 0, t.labels.yearTotal],
        [stats.by_month[monthKey] || 0, t.labels.monthTotal],
        [stats.max_clear_days || 0, t.labels.maxClear],
        [stats.current_clear_streak || 0, t.labels.currentClear]
      ].forEach(([num, lbl]) => {
        const box = el('div', 'stat-box');
        box.appendChild(el('p', 'num', String(num)));
        box.appendChild(el('p', 'lbl', lbl));
        grid.appendChild(box);
      });
      panel.appendChild(grid);
      panel.appendChild(renderCountTable(t.labels.byMonth, stats.by_month, t.labels.noneYet));
      panel.appendChild(renderCountTable(t.labels.byYear, stats.by_year, t.labels.noneYet));
    }

    function renderHow(t) {
      const how = document.getElementById('how');
      how.textContent = '';
      const summary = document.createElement('summary');
      summary.textContent = t.how.title;
      how.appendChild(summary);
      const ol = el('ol', 'how-steps');
      t.how.steps.forEach(step => ol.appendChild(el('li', null, step)));
      how.appendChild(ol);
    }

    function renderCredit(t, D) {
      const credit = document.getElementById('credit');
      const bits = [t.credit];
      if (D && D.history_start) bits.push(t.labels.historyFrom + ': ' + D.history_start + '.');
      credit.textContent = bits.join(' ');
    }

    function switchLang(lang) {
      if (typeof siteTrack === 'function') siteTrack('click/lang-' + lang);
      const main = document.querySelector('main');
      const active = document.activeElement;
      const refocus = active && active.closest && active.closest('#lang') ? active.getAttribute('aria-label') : null;
      const apply = () => {
        render(lang);
        if (refocus) {
          const btn = document.querySelector('#lang button[aria-label="' + refocus + '"]');
          if (btn) btn.focus({ preventScroll: true });
        }
      };
      if (REDUCED) { apply(); return; }
      main.classList.add('is-swapping');
      setTimeout(() => {
        apply();
        requestAnimationFrame(() => main.classList.remove('is-swapping'));
      }, 160);
    }

    const header = document.querySelector('.site-header');
    function updateHeader() { header.classList.toggle('is-scrolled', window.scrollY > 4); }
    window.addEventListener('scroll', updateHeader, { passive: true });
    updateHeader();

    function render(lang) {
      const t = T[lang];
      const D = window.METRO_DATA;
      document.documentElement.lang = lang;
      document.title = t.meta.title;
      document.querySelector('meta[name="description"]').setAttribute('content', t.meta.description);
      SiteLang.renderButtons(document.getElementById('lang'), lang, switchLang);
      renderThemeToggle(lang);
      setText('back', t.back);
      setText('note', t.note);
      setText('title', t.title);
      setText('lead', t.lead);
      setText('footer', t.footer + ' © ' + new Date().getFullYear());
      setText('h-lines', t.labels.lines);
      setText('h-detail', t.labels.detail);
      renderHow(t);
      const hasData = !!(D && D.lines && D.lines.length);
      document.getElementById('empty').hidden = hasData;
      setText('empty', t.labels.empty);
      document.getElementById('dashboard').hidden = !hasData;
      if (hasData) {
        renderCredit(t, D);
        renderSummary(t, D);
        renderLines(t, D);
        renderDetail(t, D);
      } else {
        document.getElementById('credit').textContent = t.credit;
      }
      SiteLang.store(lang);
    }

    const THEME_LABELS = {
      en: ['Switch to light theme', 'Switch to dark theme'],
      es: ['Cambiar a tema claro', 'Cambiar a tema oscuro'],
      fr: ['Passer au thème clair', 'Passer au thème sombre']
    };
    const ICON_SUN = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
    const ICON_MOON = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

    function renderThemeToggle(lang) {
      const btn = document.getElementById('theme-toggle');
      const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
      btn.innerHTML = isDark ? ICON_SUN : ICON_MOON;
      const label = THEME_LABELS[lang][isDark ? 0 : 1];
      btn.setAttribute('aria-label', label);
      btn.title = label;
      btn.onclick = () => {
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('site-theme', next); } catch (e) { /* storage unavailable */ }
        if (typeof siteTrack === 'function') siteTrack('click/theme-' + next);
        render(lang);
      };
    }

    render(SiteLang.pick());
  </script>
  <script>
    (function () {
      var start = Date.now();
      var sent = false;
      function bucket(sec) {
        return sec < 10 ? 'under-10s' : sec < 60 ? '10-60s' : sec < 180 ? '1-3min' : 'over-3min';
      }
      function send() {
        if (sent || typeof siteTrack !== 'function') return;
        sent = true;
        var sec = Math.round((Date.now() - start) / 1000);
        siteTrack('time/' + bucket(sec) + location.pathname);
      }
      window.addEventListener('pagehide', send);
    })();
  </script>
  <script>
    (function () {
      var SITE_HOSTS = ['henao.me', 'www.henao.me', 'felipeache.github.io'];
      function send(path) {
        if (typeof siteTrack === 'function') siteTrack(path);
      }
      function labelFor(a) {
        var href = a.getAttribute('href') || '';
        if (href.indexOf('mailto:') === 0) return 'email';
        if (a.hostname === 'www.linkedin.com') return 'linkedin';
        if (a.hostname === 'github.com') return 'github';
        if (a.classList.contains('back')) return 'back';
        if (href.indexOf('training') !== -1) return 'training';
        if (href.indexOf('metro') !== -1) return 'metro';
        if (href.indexOf('index') !== -1 || href === '/' || href.charAt(0) === '#') return 'home';
        return 'other';
      }
      var from = null;
      try { from = document.referrer ? new URL(document.referrer) : null; } catch (e) { from = null; }
      if (from && SITE_HOSTS.indexOf(from.hostname) !== -1) {
        send('nav/' + from.pathname + ' > ' + location.pathname);
      } else {
        send('entry' + location.pathname);
      }
      document.addEventListener('click', function (e) {
        var a = e.target.closest ? e.target.closest('a[href]') : null;
        if (a) send('click/' + labelFor(a));
      });
    })();
  </script>
</body>
</html>
